    revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467
    license: apache-2.0
    role: finetune  # the model Lumen fine-tunes and ships
  smolvlm2-256m:
    repo: HuggingFaceTB/SmolVLM2-256M-Video-Instruct
    revision: 067788b187b95ebe7b2e040b3e4299e342e5b8fd
    license: apache-2.0
    role: zero-shot baseline
  smolvlm2-2.2b:
    repo: HuggingFaceTB/SmolVLM2-2.2B-Instruct
    revision: 482adb537c021c86670beed01cd58990d01e72e4
    license: apache-2.0
    role: zero-shot baseline (upper reference)
  lfm2.5-vl-450m:
    repo: LiquidAI/LFM2.5-VL-450M
    revision: fc6221ca597f3315e4f82fc2df606783267b34ba
    license: lfm1.0  # LFM Open License: commercial-use restrictions; baseline only
    role: zero-shot baseline (newer non-SmolVLM challenger)

# LoRA adapters Lumen trains are pushed to private Hub repos and pinned here by commit SHA
# (Stage 3). The Mac downloads an adapter only by the revision recorded here.
adapters:
  # The dev-chosen fine-tune (results/finetune/choice.json), printed by `run_stages.py pin_adapter`.
  lr4e-4-e2:
    repo: cjitendr/lumen-adapter
    revision: 3855491a2282b3033b5e45d7cae72a38093e5edc
    path: runs/lr4e-4/epoch-2
    base: smolvlm2-500m
    run: lr4e-4
    epoch: 2
    step: 4618
    spec_sha256: 05e123855515a48d7387763b18d83a6fcfe678608dedae81bcb7cab86a123766
    image_longest_edge: 1024
    prompt_key: abstain
    license: apache-2.0
    role: fine-tuned LoRA adapter (Stage 3)
    files:
      README.md: 659f16d7cb808d7e8e4d1e532c74a786a1c42e37af20a716e9c9d2167dc9e6af
      adapter_config.json: 2b2e166cd18643a2f2fc7756cb7eacfd467cc835d69b8daf507ddc3a12d34e2f
      adapter_model.safetensors: b1e370bf535f70d08d65caae4fab725fb5348070008340f55850f922b0611864
      lumen_adapter.json: 77242e4f6ebe128d950366b75905fd308d0fed976904170ba75d51724dceb799

# Model prediction files never enter git: they hold model outputs about users' photos and can
# repeat private details, and this repo will become public. They go to a private Hugging Face
# dataset repo; each result in git records the file's path, Hub commit revision, and sha256.
predictions:
  repo: cjitendr/lumen-predictions  # private *dataset* repo; HF_TOKEN needs write access

# LoRA adapters (Stage 3) are pushed to this private Hub *model* repo, then pinned by commit SHA
# under `adapters` below. HF_TOKEN is fine-grained: write access to these two repos only.
adapter_repo: cjitendr/lumen-adapter

splits:
  seed: 20260928
  dev_fraction: 0.10       # carved from official train, stratified on answerable (VizWiz has one
                           # question per image; the loader asserts it, so no image is in both)
  mac_sample_size: 300     # val questions for on-device tests, stratified on answerable x answer_type
  dev_select_size: 512     # fixed subset of dev for zero-shot prompt choice (approved 2026-09-30),
                           # stratified on answerable x answer_type; built on Kaggle, then committed
