# Every dataset file and model Lumen uses, pinned. Code reads this file through lumen.pins;
# nothing downloads an unpinned artifact.
#
# Dataset files: `size` and `etag` were read from the VizWiz host on 2026-09-28. `sha256` values
# come from the first Kaggle `data` run (2026-09-28, commit 48788b5; results/data/observed_hashes.json)
# and are enforced from then on: any download that doesn't match stops the runner. Files still
# null (test_answers, test_images) are fetched only by the sealed final test run, which pins them
# the same way on first use.

dataset:
  name: VizWiz-VQA
  homepage: https://vizwiz.org/tasks-and-datasets/vqa/
  license: CC BY 4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  files:
    annotations:  # train.json + val.json (+ test.json without answers)
      url: https://vizwiz.cs.colorado.edu/VizWiz_final/vqa_data/Annotations.zip
      size: 1711273
      etag: "1a1ca9-5f1efd408b3bc"
      sha256: dbc32fc1e3f1b1039aea906030d569d6c238b4ddb2eea5e3453a6a565c829ec9
    test_answers:  # test answers, publicly released 2026-04-28
      url: https://vizwiz.cs.colorado.edu/VizWiz_all_answers/VQA_test.json
      size: 8227183
      etag: null
      sha256: null
    train_images:
      url: https://vizwiz.cs.colorado.edu/VizWiz_final/images/train.zip
      size: 11298421598
      etag: "2a1703b5e-59afdc1e58080"
      sha256: f31d712fe0bd6b136b100b7d5677b0006dcda64704f0b5f7af2f5f1373215d74
    val_images:
      url: https://vizwiz.cs.colorado.edu/VizWiz_final/images/val.zip
      size: 3488913457
      etag: "cff49831-59b08b3044b40"
      sha256: 7cc829c1fbcbc9ffd0a895f9df33d4b365557289c037a578ea9f812e41422469
    test_images:  # downloaded only for the single final test evaluation
      url: https://vizwiz.cs.colorado.edu/VizWiz_final/images/test.zip
      size: 3975272799
      etag: "ecf1d95f-59afd88518300"
      sha256: null

  # The official evaluation code that src/lumen/eval/ ports (from API.zip on the VizWiz host).
  eval_code:
    url: https://vizwiz.cs.colorado.edu/VizWiz_final/vqa_data/API.zip
    path: PythonEvaluationTools/vqaEvaluation/vqaEval.py
    sha256: d26ef7ac2db06351444c3531f8d95fd9c454423fbcb9fd5dd984f12281146694

