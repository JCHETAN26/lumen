[project]
name = "lumen"
version = "0.1.0"
description = "On-device visual assistant for blind and low-vision users: VizWiz-VQA fine-tuning, answerability, and MLX inference"
readme = "README.md"
requires-python = ">=3.11,<3.14"
# Core: data pipeline and evaluation only. No torch here, so CI stays fast and the Mac and Kaggle
# share exactly the same metric code.
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
    "scikit-learn>=1.4",  # average_precision_score / f1_score, exactly as the official VizWiz code
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Inference and training with PyTorch: CUDA on Kaggle's T4 (cu126 build: supports sm_75 and
# older drivers than the CUDA 13 build), CPU/MPS wheels from PyPI on the Mac for local tests.
gpu = [
    "torch==2.14.0",
    "torchvision==0.29.0",  # the fast image processors need it
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "num2words==0.5.14",  # required by the SmolVLM processor
]
# Apple-silicon inference with MLX (Mac only).
mlx = [
    "mlx==0.32.2; sys_platform == 'darwin'",
    "mlx-vlm==0.7.3; sys_platform == 'darwin'",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Print skip reasons, so a live test skipped for a usage cap or missing credentials is visible.
addopts = "-rs"
markers = [
    "live: calls a real external service (Hugging Face, Kaggle, VizWiz host); skips cleanly on usage caps and missing credentials; excluded from CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generator script that reproduces the official evaluator verbatim; not Lumen code.
extend-exclude = ["tests/fixtures/make_official_golden.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]  # the official metric's contraction table uses typographic apostrophes
